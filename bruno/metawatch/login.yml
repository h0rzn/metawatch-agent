info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/login?username=master&password=master"
  params:
    - name: username
      value: master
      type: query
    - name: password
      value: master
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
